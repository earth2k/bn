<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 Year Anniversary 💙</title>

<style>
/* ===================== COMMON ===================== */
body,html{
  margin:0; padding:0;
  width:100%; height:100%;
  overflow:hidden;
  font-family:"Segoe UI",system-ui,sans-serif;
}
.page{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:1s ease;
  z-index:100;
}
.hidden{opacity:0;pointer-events:none}

/* ===================== PAGE 1 : OPEN ===================== */
#page-open{
  background:linear-gradient(135deg,#a18cd1,#fbc2eb);
}
.open-card{
  padding:90px 70px;
  border-radius:60px;
  background:rgba(255,255,255,.25);
  backdrop-filter:blur(25px);
  text-align:center;
  color:#fff;
  box-shadow:0 40px 120px rgba(0,0,0,.3);
}
.open-card button{
  margin-top:40px;
  padding:20px 70px;
  border:none;
  border-radius:50px;
  font-size:20px;
  cursor:pointer;
}

/* ===================== PAGE 2 : PASSCODE ===================== */
#page-pass{
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;
}
.pass-box{
  text-align:center;
}
.pass-dots{
  letter-spacing:12px;
  font-size:32px;
  margin-bottom:30px;
}
.keypad{
  display:grid;
  grid-template-columns:repeat(3,80px);
  gap:16px;
  justify-content:center;
}
.keypad button{
  width:80px;height:80px;
  border-radius:50%;
  border:none;
  font-size:26px;
  cursor:pointer;
}

/* ===================== PAGE 3 : HEART ===================== */
#page-heart{
  background:radial-gradient(circle at top,#ff9a9e,#fad0c4);
}
.heart-wrap{
  width:240px;height:220px;
  position:relative;
  cursor:pointer;
}
.heart{
  position:absolute;
  width:100%;height:100%;
  background:#ff4f8b;
  clip-path:path("M120 200 C-40 90 40 -20 120 60 C200 -20 280 90 120 200 Z");
}
.heart-fill{
  position:absolute;
  bottom:0;left:0;
  width:100%;
  height:0%;
  background:linear-gradient(to top,#ff85b3,#ffd1dc);
  clip-path:inherit;
  transition:.4s ease;
}

/* ===================== PAGE 4 : FIREWORK ===================== */
#page-fire{
  background:black;
  color:white;
  font-size:28px;
}

/* ===================== PAGE 5 : CARD ===================== */
#card-wrapper{
  position:fixed;
  inset:0;
  z-index:1;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page" id="page-open">
  <div class="open-card">
    <h1>สำหรับน้องโอปอนะจ๊ะ 💙</h1>
    <button onclick="goPass()">✨ เปิดสิ</button>
  </div>
</div>

<!-- PAGE 2 -->
<div class="page hidden" id="page-pass">
  <div class="pass-box">
    <div class="pass-dots" id="dots">○ ○ ○ ○ ○ ○</div>
    <div class="keypad">
      <button onclick="press(1)">1</button><button onclick="press(2)">2</button><button onclick="press(3)">3</button>
      <button onclick="press(4)">4</button><button onclick="press(5)">5</button><button onclick="press(6)">6</button>
      <button onclick="press(7)">7</button><button onclick="press(8)">8</button><button onclick="press(9)">9</button>
      <button></button><button onclick="press(0)">0</button><button onclick="resetPass()">⌫</button>
    </div>
  </div>
</div>

<!-- PAGE 3 -->
<div class="page hidden" id="page-heart">
  <div class="heart-wrap" onclick="fillHeart()">
    <div class="heart"></div>
    <div class="heart-fill" id="heartFill"></div>
  </div>
</div>

<!-- PAGE 4 -->
<div class="page hidden" id="page-fire">
  ✨💥💜🎆
</div>

<!-- PAGE 5 : ORIGINAL CODE (UNCHANGED) -->
<div id="card-wrapper">
<!-- ====== โค้ดเดิมของน้อง (ไม่แก้แม้แต่บรรทัดเดียว) ====== -->

<!DOCTYPE html><html lang="th"><head><!-- กำหนดชุดอักขระเป็น UTF-8 เพื่อให้ภาษาไทยไม่เพี้ยน --><meta charset="UTF-8"><!-- ทำให้เว็บรองรับมือถือ / iPad / ทุกขนาดจอ --><meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- ชื่อเว็บที่แสดงบนแท็บ --><title>1 Year Anniversary 💙</title><style>
:root{--bg1:#eef4ff;--bg2:#dbe8ff;--bg3:#e3dcff;--deep:#4f5b82;}
*{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif;}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));overflow:hidden;}
.glow{position:fixed;width:520px;height:520px;background:radial-gradient(circle,rgba(160,190,255,.65),transparent 70%);filter:blur(90px);animation:move 26s infinite alternate ease-in-out;z-index:0;}
.g1{top:-220px;left:-200px;}
.g2{bottom:-240px;right:-200px;animation-delay:6s;}
@keyframes move{to{transform:translateY(160px);}}
.bg{position:fixed;inset:0;pointer-events:none;z-index:1;}
.float-img{position:absolute;bottom:-80px;width:30px;height:30px;border-radius:50%;object-fit:cover;opacity:.85;animation:rise linear forwards;box-shadow:0 6px 14px rgba(120,150,255,.35);}
.floating{position:absolute;bottom:-60px;font-size:18px;animation:rise linear forwards;opacity:.7;}
@keyframes rise{from{transform:translateY(0) scale(.9);opacity:0;}20%{opacity:1;}to{transform:translateY(-120vh) scale(1.15);opacity:0;}}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#9fc4ff,#b19cff);z-index:50;transition:1.2s ease;}
.intro-card{background:rgba(255,255,255,.25);backdrop-filter:blur(28px);padding:90px 60px;border-radius:60px;text-align:center;color:#fff;box-shadow:0 40px 120px rgba(0,0,0,.25);}
.intro-card h1{font-size:40px;margin-bottom:18px;}
.intro-card button{margin-top:46px;padding:20px 70px;border:none;border-radius:50px;font-size:18px;cursor:pointer;background:#fff;color:#6a7dff;box-shadow:0 12px 30px rgba(0,0,0,.25);}
.main{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(40px);transition:1.2s ease;}
.main.show{opacity:1;transform:none;}
.card{max-width:460px;background:rgba(235,245,255,.9);backdrop-filter:blur(30px);border-radius:54px;padding:52px 36px;text-align:center;box-shadow:0 45px 120px rgba(120,170,255,.35),0 0 40px rgba(180,210,255,.45);}
.photo-wrap{width:200px;height:200px;margin:0 auto 28px;}
.photo{width:100%;height:100%;border-radius:50%;overflow:hidden;border:7px solid #fff;}
.photo img{width:100%;height:100%;object-fit:cover;}
h2{font-size:32px;color:var(--deep);}
.names{font-size:19px;color:#6a78a0;}
.badge{margin-top:16px;padding:12px 28px;border-radius:30px;background:linear-gradient(135deg,#9fc4ff,#b19cff);color:#fff;display:inline-block;box-shadow:0 8px 20px rgba(120,140,255,.45);}
#loveTime{margin-top:18px;font-size:14px;color:#5a6a8f;line-height:1.8;}
.message{margin-top:22px;padding:18px 20px;border-radius:20px;background:#f1f6ff;color:#4f5f88;font-size:15px;}
@media (max-width:600px){.card{max-width:90%;}.intro-card{padding:70px 40px;}}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="bg" id="bg"></div>
<div id="intro"><div class="intro-card"><h1>สำหรับน้องโอปอนะจ๊ะ 💙</h1><button onclick="enter()">✨ เปิดสิ</button></div></div>
<div class="main" id="main"><div class="card">
<div class="photo-wrap"><div class="photo"><img src="main.jpg"></div></div>
<h2>Happy Anniversary</h2>
<div class="names">เอิร์ท 🤍 น้องโอปอ</div>
<div class="badge">1Y • 08/02/25</div>
<div id="loveTime"></div>
<div class="message">เขียนอะไรดีน้าา 💙  สกีบีดี้ทอยเลต</div>
</div></div>
<script>
function enter(){document.getElementById("intro").style.opacity=0;setTimeout(()=>{document.getElementById("intro").style.display="none";document.getElementById("main").classList.add("show");},1200);}
function updateLoveTime(){
const start=new Date(2025,1,8,7,40,0);const now=new Date();let d=Math.floor((now-start)/1000);
const day=Math.floor(d/86400);d%=86400;const h=Math.floor(d/3600);d%=3600;const m=Math.floor(d/60);const s=d%60;
loveTime.innerHTML=`กี่วันแล้วววววววววววววววววว 💕<br>${day} วัน ${h} ชั่วโมง ${m} นาที ${s} วินาที`;
}
setInterval(updateLoveTime,1000);updateLoveTime();
const imgs=["pic1.jpg","pic2.jpg","pic3.jpg","pic4.jpg","pic5.jpg","pic6.jpg"];
setInterval(()=>{const i=document.createElement("img");i.src=imgs[Math.floor(Math.random()*imgs.length)];
i.className="float-img";i.style.left=Math.random()*100+"vw";i.style.animationDuration=(12+Math.random()*6)+"s";
bg.appendChild(i);setTimeout(()=>i.remove(),22000);},400);
const icons=["🤍","💙","✨","⭐","🌸","🌼"];
setInterval(()=>{const f=document.createElement("div");f.className="floating";f.innerText=icons[Math.floor(Math.random()*icons.length)];
f.style.left=Math.random()*100+"vw";f.style.animationDuration=(11+Math.random()*6)+"s";
bg.appendChild(f);setTimeout(()=>f.remove(),20000);},650);
</script>
</body></html>

<!-- ====== END ORIGINAL ====== -->
</div>

<script>
/* ================= LOGIC ================= */
let pass="", correct="080225";
let heartCount=0;

function goPass(){
  document.getElementById("page-open").classList.add("hidden");
  document.getElementById("page-pass").classList.remove("hidden");
}
function press(n){
  if(pass.length>=6) return;
  pass+=n;
  document.getElementById("dots").innerText="● ".repeat(pass.length)+"○ ".repeat(6-pass.length);
  if(pass.length===6 && pass===correct){
    document.getElementById("page-pass").classList.add("hidden");
    document.getElementById("page-heart").classList.remove("hidden");
  }
}
function resetPass(){
  pass="";
  document.getElementById("dots").innerText="○ ○ ○ ○ ○ ○";
}
function fillHeart(){
  heartCount++;
  document.getElementById("heartFill").style.height=(heartCount*10)+"%";
  if(heartCount>=10){
    document.getElementById("page-heart").classList.add("hidden");
    document.getElementById("page-fire").classList.remove("hidden");
    setTimeout(()=>{
      document.getElementById("page-fire").classList.add("hidden");
    },5000);
  }
}
</script>

</body>
</html>
